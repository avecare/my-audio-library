<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>مكتبتي الصوتية</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-mark">♫</div>
      <div><h1>مكتبتي الصوتية</h1><p>ارفع تسجيلاتك واحتفظ بروابطها</p></div>
    </header>

    <section id="login-panel" class="panel">
      <h2>تسجيل الدخول</h2>
      <p class="muted">هذه اللوحة خاصة بصاحب الحساب فقط.</p>
      <form id="login-form">
        <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label>
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">دخول</button>
      </form>
      <p id="login-message" class="message" role="status"></p>
    </section>

    <section id="app-panel" class="hidden">
      <div class="toolbar">
        <div><h2>ملفاتي الصوتية</h2><p class="muted">يمكنك رفع MP3 أو WAV أو M4A.</p></div>
        <button id="logout" class="secondary">تسجيل الخروج</button>
      </div>
      <section class="panel">
        <label class="dropzone" for="audio-file">
          <span class="upload-icon">↑</span>
          <strong>اختاري ملفًا صوتيًا</strong>
          <span class="muted">الحد الأقصى الافتراضي 25 ميغابايت للملف</span>
          <input id="audio-file" type="file" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4">
        </label>
        <div class="upload-row">
          <span id="selected-name" class="muted">لم يتم اختيار ملف</span>
          <button id="upload" disabled>رفع الملف</button>
        </div>
        <p id="upload-message" class="message" role="status"></p>
      </section>

      <section class="panel">
        <div class="list-heading"><h2>التسجيلات المرفوعة</h2><button id="refresh" class="secondary">تحديث</button></div>
        <div id="files-list" class="files-list"><p class="muted">سجّلي الدخول لعرض ملفاتك.</p></div>
      </section>
    </section>
    <footer>روابط الملفات عامة لمن يمتلك الرابط؛ لوحة الإدارة فقط محمية بتسجيل الدخول.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
