<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبتي | مساحة ملفاتك</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="app-shell">
<header class="topbar">
  <h1>✦ مكتبتي</h1>
  <button id="logout" class="hidden">تسجيل الخروج</button>
</header>

<section id="login-panel" class="panel">
  <h2>أهلاً بعودتك</h2>
  <p>سجّل الدخول إلى مكتبتك الخاصة</p>
  <form id="login-form">
    <input id="email" type="email" placeholder="البريد الإلكتروني" required>
    <input id="password" type="password" placeholder="كلمة المرور" required>
    <button type="submit">دخول</button>
  </form>
  <p id="login-message"></p>
</section>

<section id="app-panel" class="hidden">
  <div class="hero">
    <h2>مكتبتك، بطريقتك ✨</h2>
    <p>نظّم ملفاتك وابحث عنها بسهولة</p>
  </div>

  <section class="panel">
    <h3>رفع ملفات جديدة</h3>
    <input id="media-file" type="file" multiple accept=".mp3,.wav,.m4a,.jpg,.jpeg,.png,.webp">
    <p id="selected-name"></p>
    <button id="upload" disabled>رفع الملفات</button>
    <p id="upload-message"></p>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h3 id="current-title">كل الملفات</h3>
      <button id="new-folder">＋ مجلد جديد</button>
    </div>
    <input id="search" type="search" placeholder="⌕ ابحث عن ملف أو مجلد">
    <div id="folder-list"></div>
    <div id="files-list"></div>
  </section>
</section>
<footer>مكتبتي الخاصة ✦</footer>
</main>
<script src="app.js"></script>
</body>
</html>
